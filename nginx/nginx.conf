
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 1. HTTP -> HTTPS Redirect
    server {
        listen 80;
        server_name iiitviva.online livekit.iiitviva.online;
        return 301 https://$host$request_uri;
    }

    # 2. OpenViva Web App (:3001)
    server {
        listen 443 ssl http2;
        server_name iiitviva.online;

        ssl_certificate /etc/nginx/ssl/iiitviva.online.crt;
        ssl_certificate_key /etc/nginx/ssl/iiitviva.online.key;

        client_max_body_size 50M;

        location = / {
            return 302 /openviva;
        }

        location / {
            proxy_pass http://10.10.16.13:3001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # 3. LiveKit Signaling & WebSocket (:7880)
    server {
        listen 443 ssl http2;
        server_name livekit.iiitviva.online;

        ssl_certificate /etc/nginx/ssl/iiitviva.online.crt;
        ssl_certificate_key /etc/nginx/ssl/iiitviva.online.key;

        location / {
            proxy_pass http://10.10.16.13:7880;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}

